name: Refresh profile graphics

on:
  schedule:
    - cron: "17 3 * * 1" # weekly: every run commits a new photograph, about 1.4 MB
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Print and photograph the page
        working-directory: tools
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: |
          # The default token cannot see private contributions and would shrink the figures.
          if [ -z "$GH_TOKEN" ]; then echo "PROFILE_TOKEN is not set, keeping current graphics"; exit 0; fi
          npm ci
          pip install -r requirements.txt
          npm run build
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "chore(stats): refresh profile graphics" && git push)
